---
# Wave -1: namespaces first, so later waves have somewhere to land.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: virt-demo-namespaces
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/epheo/descheduler-virt-demo.git   # canonical repo — change if you fork
    targetRevision: main
    path: manifests/00-namespaces
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
