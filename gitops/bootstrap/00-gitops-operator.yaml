---
# Installs Red Hat OpenShift GitOps (Argo CD). This is a one-time bootstrap you
# apply by hand; everything after this is driven by Argo CD from Git.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-gitops-operator
  namespace: openshift-operators
spec:
  channel: latest
  name: openshift-gitops-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
# After this reconciles, a default Argo CD instance comes up in the
# `openshift-gitops` namespace. Its application-controller has cluster-admin in
# that instance, so it can manage the cluster-scoped objects this demo needs
# (Namespace, MachineConfig, Subscription, KubeDescheduler).
