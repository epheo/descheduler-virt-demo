---
# Eviction strategy: LiveMigrateIfPossible.
#
# DRS analog: migrate if able, otherwise leave running. Use for VMs that might
# not be live-migratable (e.g. they could gain a non-migratable device). Unlike
# plain LiveMigrate, a non-migratable VM with this strategy does not block a node
# drain or cluster upgrade — it is left in place.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-evict-if-possible
  namespace: virt-drs-demo
  labels:
    app: drs-demo
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: vm-evict-if-possible
    spec:
      evictionStrategy: LiveMigrateIfPossible
      domain:
        cpu:
          cores: 1
        memory:
          guest: 1Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:latest
---
# Eviction strategy: None (pinned / never auto-migrated).
#
# DRS analog: a VM with DRS automation Disabled. This VM is never live-migrated
# automatically — not by node drain, not by the descheduler. Use for
# latency-sensitive or licence-pinned guests that must stay put.
#
# Note: with evictionStrategy None, a node drain is blocked by this VM until it
# is stopped manually; moving it is the operator's responsibility.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-pinned-none
  namespace: virt-drs-demo
  labels:
    app: drs-demo
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: vm-pinned-none
    spec:
      evictionStrategy: None
      domain:
        cpu:
          cores: 1
        memory:
          guest: 1Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:latest
