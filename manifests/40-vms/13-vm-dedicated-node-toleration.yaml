---
# Dedicated hosts: taints + tolerations.
#
# DRS analog: a dedicated host/cluster carved out for a workload class. Taint
# nodes reserved for virtualization so ordinary pods stay off them; only VMs that
# tolerate the taint may land there.
#
# Reserve nodes first:
#   oc adm taint node <node> dedicated=virtualization:NoSchedule
#   oc label node <node> node-role.kubernetes.io/vm-zone=gold
#
# A toleration does not force the VM onto the tainted node, it only permits it.
# Combine with nodeSelector/affinity to also attract it there.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-dedicated-node
  namespace: virt-drs-demo
  labels:
    app: drs-demo
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: vm-dedicated-node
    spec:
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "virtualization"
          effect: "NoSchedule"
      nodeSelector:
        node-role.kubernetes.io/vm-zone: gold
      domain:
        cpu:
          cores: 1
        memory:
          guest: 1Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:latest
